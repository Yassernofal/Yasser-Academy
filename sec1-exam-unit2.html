<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>امتحان Unit 2 – Hands Help, Hearts Care | أكاديمية مستر ياسر نوفل</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=El+Messiri:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'El Messiri', serif; background: #f0f4fa; padding-top: 78px; }
    .navbar-custom { background: rgba(10, 31, 68, 0.95) !important; padding: 14px 0; }
    .navbar-brand .brand-name { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.4rem; color: #f7e05e; }
    .navbar-brand .brand-name span { color: #ffb347; }

    /* قواعد الاتجاه */
    .question-card .q-text, .question-card .options { direction: ltr !important; text-align: left !important; }
    .exam-header h1 { text-align: center !important; }
    .result-box h3, .result-box p { text-align: center !important; }

    .exam-container { max-width: 900px; margin: 30px auto; background: #fff; border-radius: 24px; padding: 35px; box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
    .exam-header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 3px solid #f7e05e; }
    .exam-header h1 { font-family: 'Playfair Display', serif; color: #0a1f44; font-size: 1.8rem; font-style: italic; margin-bottom: 8px; }
    .exam-header p { color: #666; }
    .exam-header .meta { display: flex; justify-content: center; gap: 25px; margin-top: 15px; flex-wrap: wrap; }
    .exam-header .meta span { background: #f8f9fa; padding: 8px 16px; border-radius: 20px; color: #0a1f44; font-weight: 600; }

    .timer-box { position: sticky; top: 90px; z-index: 100; background: linear-gradient(135deg, #0a1f44, #1a3a6e); color: #f7e05e; padding: 12px 25px; border-radius: 50px; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; font-size: 1.2rem; margin-bottom: 25px; }
    .timer-box.warning { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff; }

    .progress-exam { height: 8px; background: #e9ecef; border-radius: 10px; overflow: hidden; margin-bottom: 25px; }
    .progress-exam .progress-bar { background: linear-gradient(90deg, #f7b731, #f7e05e); transition: width 0.4s ease; }

    .question-card { background: #f8f9fa; border-radius: 18px; padding: 25px; margin-bottom: 20px; border-right: 5px solid #f7e05e; }
    .question-card .q-num { display: inline-block; background: #0a1f44; color: #f7e05e; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; margin-bottom: 12px; font-family: 'Cinzel', serif; }
    .question-card .q-text { font-weight: 700; color: #0a1f44; font-size: 1.1rem; margin-bottom: 15px; }
    .question-card .options { display: grid; gap: 10px; }
    .question-card .option { background: #fff; border-radius: 12px; padding: 14px 18px; cursor: pointer; transition: 0.3s; border: 2px solid #e9ecef; display: flex; align-items: center; gap: 12px; }
    .question-card .option:hover { border-color: #f7b731; background: #fffbf0; }
    .question-card .option.selected { background: linear-gradient(135deg, #0a1f44, #1a3a6e); color: #f7e05e; border-color: #0a1f44; }
    .question-card .option .letter { width: 30px; height: 30px; border-radius: 50%; background: #e9ecef; color: #0a1f44; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
    .question-card .option.selected .letter { background: #f7e05e; }
    .question-card .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .question-card .option.correct .letter { background: #28a745; color: #fff; }
    .question-card .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .question-card .option.wrong .letter { background: #dc3545; color: #fff; }

    .btn-submit { background: linear-gradient(135deg, #0a1f44, #1a3a6e); color: #f7e05e; padding: 15px 50px; border-radius: 50px; font-weight: 800; font-size: 1.1rem; border: none; transition: 0.3s; display: block; margin: 30px auto 0; }
    .btn-submit:hover { background: #f7b731; color: #0a1f44; }

    .result-box { text-align: center; padding: 40px 20px; }
    .result-box .score-circle { width: 180px; height: 180px; border-radius: 50%; background: linear-gradient(135deg, #0a1f44, #1a3a6e); color: #f7e05e; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 25px; }
    .result-box .score-circle .score { font-size: 3rem; font-weight: 800; font-family: 'Cinzel', serif; }
    .result-box .score-circle .total { font-size: 1.2rem; color: #b0c4de; }
    .result-box h3 { color: #0a1f44; font-weight: 800; }
    .result-box .actions { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 25px; }
    .result-box .actions a, .result-box .actions button { padding: 12px 30px; border-radius: 50px; font-weight: 700; text-decoration: none; border: none; }
    .result-box .actions .btn-retry { background: #f7e05e; color: #0a1f44; }
    .result-box .actions .btn-back { background: #0a1f44; color: #f7e05e; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-name">Mr. <span>Yasser</span> Nofal</span>
      </a>
      <div class="ms-auto">
        <a href="student-dashboard.html" style="color:#f7e05e; text-decoration:none; font-weight:600;">← لوحة الطالب</a>
      </div>
    </div>
  </nav>

  <div class="exam-container">
    <div id="examView">
      <div class="exam-header">
        <h1>Unit 2 Exam: Hands Help, Hearts Care</h1>
        <p>أولى ثانوي - Term 1</p>
        <div class="meta">
          <span><i class="fas fa-question-circle"></i> 30 سؤال</span>
          <span><i class="fas fa-clock"></i> 30 دقيقة</span>
          <span><i class="fas fa-star"></i> 30 درجة</span>
        </div>
      </div>

      <div class="timer-box" id="timerBox">
        <i class="fas fa-hourglass-half"></i>
        <span id="timerDisplay">30:00</span>
      </div>

      <div class="progress-exam">
        <div class="progress-bar" id="examProgress" style="width: 0%;"></div>
      </div>

      <div id="questionsContainer"></div>

      <button class="btn-submit" onclick="submitExam()">
        <i class="fas fa-paper-plane"></i> تسليم الامتحان
      </button>
    </div>

    <div id="resultView" style="display: none;">
      <div class="result-box">
        <div class="score-circle">
          <div class="score" id="finalScore">0</div>
          <div class="total">من 30</div>
        </div>
        <h3 id="resultTitle">أحسنت!</h3>
        <p id="resultMessage" style="color: #666; margin: 15px 0;">لقد أكملت الامتحان بنجاح</p>
        <div class="actions">
          <button class="btn-retry" onclick="location.reload()">🔄 إعادة الامتحان</button>
          <a href="sec1-unit2.html" class="btn-back">📖 مراجعة الشرح</a>
          <a href="student-dashboard.html" class="btn-back">🏠 لوحة الطالب</a>
        </div>
      </div>
    </div>
  </div>

  <script src="sec1-unit2-questions.js"></script>
  <script>
    const QUESTIONS = [
      ...UNIT2_QUESTIONS.vocabulary,
      ...UNIT2_QUESTIONS.reading,
      ...UNIT2_QUESTIONS.grammar,
      ...UNIT2_QUESTIONS.writing
    ];

    let currentAnswers = {};
    let timeLeft = 30 * 60;
    let timerInterval = null;

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = QUESTIONS.map((q, idx) => `
        <div class="question-card" data-qid="${q.id}">
          <span class="q-num">Q${idx + 1}</span>
          <p class="q-text">${q.question}</p>
          <div class="options">
            ${q.options.map((opt, oidx) => `
              <div class="option" onclick="selectOption(${q.id}, ${oidx}, this)">
                <span class="letter">${String.fromCharCode(65 + oidx)}</span>
                <span>${opt}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function selectOption(qid, oidx, element) {
      currentAnswers[qid] = oidx;
      const card = element.closest('.question-card');
      card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      element.classList.add('selected');
      const answered = Object.keys(currentAnswers).length;
      document.getElementById('examProgress').style.width = (answered / QUESTIONS.length) * 100 + '%';
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timerDisplay').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (timeLeft <= 5 * 60) document.getElementById('timerBox').classList.add('warning');
        if (timeLeft <= 0) { clearInterval(timerInterval); submitExam(true); }
      }, 1000);
    }

    function submitExam(autoSubmit = false) {
      if (!autoSubmit) {
        const unanswered = QUESTIONS.length - Object.keys(currentAnswers).length;
        if (unanswered > 0 && !confirm(`لديك ${unanswered} سؤال لم تُجب عليه. هل تريد التسليم؟`)) return;
      }
      clearInterval(timerInterval);

      let score = 0;
      QUESTIONS.forEach(q => {
        const card = document.querySelector(`[data-qid="${q.id}"]`);
        const options = card.querySelectorAll('.option');
        const userAnswer = currentAnswers[q.id];
        options.forEach((opt, idx) => {
          opt.style.pointerEvents = 'none';
          if (idx === q.correct) opt.classList.add('correct');
          if (idx === userAnswer && userAnswer !== q.correct) opt.classList.add('wrong');
        });
        if (userAnswer === q.correct) score++;
      });

      document.getElementById('examView').style.display = 'none';
      document.getElementById('resultView').style.display = 'block';
      document.getElementById('finalScore').textContent = score;

      const percent = Math.round((score / QUESTIONS.length) * 100);
      let title, message;
      if (percent >= 90) { title = '🏆 ممتاز!'; message = 'أداء استثنائي، استمر!'; }
      else if (percent >= 75) { title = '🌟 جيد جداً!'; message = 'نتيجة ممتازة، واصل التقدم'; }
      else if (percent >= 60) { title = '👍 جيد'; message = 'يمكنك التحسن أكثر بالمراجعة'; }
      else { title = '📚 يحتاج مراجعة'; message = 'راجع الشرح وحاول مرة أخرى'; }
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultMessage').textContent = message;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
      startTimer();
    });
  </script>
</body>
</html>
