<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طلبات الاشتراك - لوحة التحكم</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&display=swap" rel="stylesheet" />
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'El Messiri', sans-serif; background: #f0f4fa; }
    .navbar-custom { background: #0a1f44; }
    .card-req { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-right: 5px solid #f7b731; }
    .btn-approve { background: #28a745; color: #fff; border-radius: 50px; border: none; }
    .btn-reject { background: #dc3545; color: #fff; border-radius: 50px; border: none; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark navbar-custom p-3 mb-4">
    <div class="container">
      <span class="navbar-brand text-warning fw-bold"><i class="fas fa-cog"></i> طلبات الاشتراك</span>
      <a href="admin-dashboard.html" class="btn btn-outline-light btn-sm">عودة للوحة التحكم</a>
    </div>
  </nav>

  <div class="container" style="max-width: 800px;">
    <h3 class="mb-4 fw-bold">الطلبات المعلقة</h3>
    <div id="requestsContainer"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFuAjSYHumAxJ_98AbYxFI8N9dSd27xL8",
      authDomain: "yasser-nofal-english-academy.firebaseapp.com",
      databaseURL: "https://yasser-nofal-english-academy-default-rtdb.firebaseio.com",
      projectId: "yasser-nofal-english-academy",
      storageBucket: "yasser-nofal-english-academy.firebasestorage.app",
      messagingSenderId: "654488740819",
      appId: "1:654488740819:web:7a513cb6c2a74d98324526"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (!user) { window.location.href = 'login.html'; return; }
      
      db.ref('users/' + user.uid).once('value').then(snap => {
        if (!snap.exists() || snap.val().role !== 'admin') {
          alert('هذه الصفحة للأدمن فقط');
          window.location.href = 'index.html';
          return;
        }
        loadRequests();
      });
    });

    function loadRequests() {
      const container = document.getElementById('requestsContainer');
      db.ref('payment_requests').on('value', snapshot => {
        container.innerHTML = '';
        if (!snapshot.exists()) {
          container.innerHTML = '<p class="text-center text-muted">لا توجد طلبات جديدة.</p>';
          return;
        }

        snapshot.forEach(child => {
          const req = child.val();
          const uid = child.key;

          if (req.status === 'pending') {
            const card = document.createElement('div');
            card.className = 'card-req';
            card.innerHTML = `
              <h5>${req.name} <span class="badge bg-warning text-dark">قيد المراجعة</span></h5>
              <p class="mb-1"><strong>الإيميل:</strong> ${req.email}</p>
              <p class="mb-1"><strong>رقم المحول منه:</strong> ${req.phone}</p>
              <p class="mb-1"><strong>رقم العملية:</strong> ${req.txnId}</p>
              <div class="d-flex gap-2 mt-3">
                <button class="btn btn-approve px-4" onclick="approve('${uid}')"><i class="fas fa-check"></i> تفعيل الاشتراك</button>
                <button class="btn btn-reject px-4" onclick="reject('${uid}')"><i class="fas fa-times"></i> رفض</button>
              </div>
            `;
            container.appendChild(card);
          }
        });
      });
    }

    window.approve = function(uid) {
      if (confirm('تأكيد تفعيل اشتراك هذا الطالب؟')) {
        // التحديث بيتم بطريقة تمنع مشاكل الصلاحيات
        db.ref('payment_requests/' + uid).update({ status: 'approved' })
          .then(() => {
            return db.ref('students/' + uid).update({ subscription: 'active' });
          })
          .then(() => {
            alert('✅ تم تفعيل الاشتراك بنجاح!');
          })
          .catch(err => {
            alert('خطأ: ' + err.message + '\nيرجى التأكد من تحديث قواعد Firebase Rules.');
          });
      }
    };

    window.reject = function(uid) {
      if (confirm('رفض هذا الطلب؟')) {
        db.ref('payment_requests/' + uid).update({ status: 'rejected' });
        alert('تم الرفض.');
      }
    };
  </script>
</body>
</html>
