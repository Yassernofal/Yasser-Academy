<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - أكاديمية مستر ياسر نوفل</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'El Messiri', sans-serif; background: #f0f4fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
    .login-card h2 { color: #0a1f44; font-weight: 800; text-align: center; margin-bottom: 30px; }
    .btn-login { background: #0a1f44; color: #f7e05e; font-weight: 700; border-radius: 50px; padding: 12px; width: 100%; border: none; transition: 0.3s; }
    .btn-login:hover { background: #1f4b8a; color: #fff; }
    .form-control { border-radius: 10px; padding: 12px; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2><i class="fas fa-user-lock text-warning"></i> تسجيل الدخول</h2>
    
    <!-- رسالة الخطأ -->
    <div id="errorMsg" class="alert alert-danger" style="display: none;"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-bold">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">كلمة المرور</label>
        <input type="password" class="form-control" id="password" required />
      </div>
      <button type="submit" class="btn btn-login mt-3" id="submitBtn">
        <i class="fas fa-sign-in-alt"></i> دخول
      </button>
    </form>
    
    <div class="text-center mt-3">
      <a href="register.html" class="text-decoration-none">ليس لديك حساب؟ إنشاء حساب جديد</a>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFuAjSYHumAxJ_98AbYxFI8N9dSd27xL8",
      authDomain: "yasser-nofal-english-academy.firebaseapp.com",
      databaseURL: "https://yasser-nofal-english-academy-default-rtdb.firebaseio.com",
      projectId: "yasser-nofal-english-academy",
      storageBucket: "yasser-nofal-english-academy.firebasestorage.app",
      messagingSenderId: "654488740819",
      appId: "1:654488740819:web:7a513cb6c2a74d98324526"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';
      btn.disabled = true;
      errorMsg.style.display = 'none';

      // 1. تسجيل الدخول عبر Firebase Auth
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          
          // 2. بعد الدخول، نتحقق من نوع الحساب في الداتابيز
          return db.ref('users/' + user.uid).once('value').then(snapshot => {
            if (snapshot.exists()) {
              const role = snapshot.val().role;
              if (role === 'admin') {
                window.location.href = 'admin-dashboard.html';
              } else {
                window.location.href = 'student-dashboard.html';
              }
            } else {
              // لو مفيش في users، ندور في students
              return db.ref('students/' + user.uid).once('value').then(studentSnap => {
                if (studentSnap.exists()) {
                  window.location.href = 'student-dashboard.html';
                } else {
                  // لو مفيش في أي مكان، نعتبره طالب ونوديه لوحة الطالب
                  window.location.href = 'student-dashboard.html';
                }
              });
            }
          });
        })
        .catch((error) => {
          // لو حصل خطأ في الإيميل أو الباسورد
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
          btn.disabled = false;
          
          errorMsg.style.display = 'block';
          if (error.code === 'auth/wrong-password') {
            errorMsg.innerText = '❌ كلمة المرور غير صحيحة.';
          } else if (error.code === 'auth/user-not-found') {
            errorMsg.innerText = '❌ لا يوجد حساب بهذا البريد الإلكتروني.';
          } else if (error.code === 'auth/invalid-email') {
            errorMsg.innerText = '❌ البريد الإلكتروني غير صالح.';
          } else {
            errorMsg.innerText = '❌ خطأ: ' + error.message;
          }
        });
    });
  </script>
</body>
</html>
