<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول – Mr. Yasser Nofal Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Cinzel:wght@600;700&family=El+Messiri:wght@500;700&family=Lateef:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'El Messiri', 'Lateef', serif;
      background: linear-gradient(135deg, #0a1f44, #1f4b8a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 78px;
    }
    @media (max-width: 991.98px) { body { padding-top: 72px; } }

    .navbar-custom {
      background: rgba(10, 31, 68, 0.85) !important;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 14px 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1050;
    }
    .navbar-brand { display: flex; align-items: center; gap: 10px; direction: ltr; }
    .navbar-brand img { height: 40px; width: auto; }
    .navbar-brand .brand-name {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: #f7e05e;
      letter-spacing: 1px;
    }
    .navbar-brand .brand-name span { color: #ffb347; }
    .nav-link { color: #e0e8f0 !important; font-weight: 500; transition: 0.3s; }
    .nav-link:hover { color: #f7e05e !important; }

    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .login-card h4 { color: #0a1f44; font-weight: 700; font-family: 'Cinzel', serif; }
    .login-card .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f7e05e;
    }
    .btn-login {
      background: linear-gradient(135deg, #0a1f44, #1f4b8a);
      color: #fff;
      border-radius: 50px;
      padding: 14px;
      font-weight: 700;
      width: 100%;
      border: none;
      transition: 0.3s;
    }
    .btn-login:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(26, 67, 138, 0.3); }
    .login-card a { color: #1f4b8a; font-weight: 700; text-decoration: none; }
    .login-card a:hover { color: #0a1f44; }
    .role-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .role-selector .btn-role {
      flex: 1;
      border-radius: 50px;
      padding: 8px 12px;
      border: 2px solid #dee2e6;
      background: #fff;
      transition: 0.3s;
      font-family: 'El Messiri', serif;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .role-selector .btn-role.active {
      border-color: #0a1f44;
      background: #0a1f44;
      color: #fff;
    }
    .role-selector .btn-role:hover { border-color: #0a1f44; }
  </style>
</head>
<body>

  <!-- ===== شريط التنقل ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo" />
        <span class="brand-name">Mr. <span>Yasser</span> Nofal</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="levels.html">📚 المستويات</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">📝 الاختبار</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">🔑 تسجيل الدخول</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">📝 التسجيل</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== المحتوى ===== -->
  <div class="container">
    <div class="login-card">
      <div class="text-center mb-4">
        <img src="assets/images/mr-yasser.jpg" alt="Mr. Yasser Nofal" class="profile-img" />
        <h4 class="mt-2">Mr. Yasser Nofal Academy</h4>
        <p class="text-muted">🔐 تسجيل الدخول إلى حسابك</p>
      </div>

      <!-- اختيار الدور -->
      <div class="role-selector">
        <button class="btn-role active" data-role="student" onclick="selectRole('student')">
          <i class="fas fa-user-graduate"></i> طالب
        </button>
        <button class="btn-role" data-role="parent" onclick="selectRole('parent')">
          <i class="fas fa-users"></i> ولي أمر
        </button>
        <button class="btn-role" data-role="admin" onclick="selectRole('admin')">
          <i class="fas fa-user-tie"></i> أدمن
        </button>
      </div>

      <div class="alert alert-info text-center py-2">
        <i class="fas fa-info-circle"></i> اختر دورك ثم سجل الدخول
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">البريد الإلكتروني</label>
          <input type="email" class="form-control" id="email" required placeholder="example@email.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">كلمة المرور</label>
          <input type="password" class="form-control" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</button>
      </form>

      <div class="text-center mt-3">
        <p>✅ ليس لديك حساب؟ <a href="register.html">سجل الآن مجاناً</a></p>
      </div>
    </div>
  </div>

  <script>
    // ===== اختيار الدور =====
    function selectRole(role) {
      document.querySelectorAll('.btn-role').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-role="${role}"]`).classList.add('active');
      localStorage.setItem('selectedRole', role);
    }

    // ===== تسجيل الدخول =====
    function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const role = localStorage.getItem('selectedRole') || 'student';

      if (!email || !password) {
        alert('❌ يرجى إدخال البريد الإلكتروني وكلمة المرور');
        return;
      }

      // محاكاة التحقق (في الواقع هنستخدم Firebase أو Backend)
      const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        alert('❌ البريد الإلكتروني أو كلمة المرور غير صحيحة');
        return;
      }

      // التأكد من تطابق الدور
      if (user.role !== role) {
        alert(`❌ هذا الحساب مسجل كـ ${user.role === 'student' ? 'طالب' : user.role === 'parent' ? 'ولي أمر' : 'أدمن'}. الرجاء اختيار الدور الصحيح.`);
        return;
      }

      // حفظ بيانات المستخدم
      const userData = {
        name: user.name || email.split('@')[0],
        email: user.email,
        role: user.role,
        loginTime: new Date().toISOString()
      };
      localStorage.setItem('user', JSON.stringify(userData));

      alert(`✅ مرحباً ${userData.name}! تم تسجيل الدخول بنجاح.`);

      // التوجيه حسب الدور
      if (user.role === 'student') {
        window.location.href = 'student-dashboard.html';
      } else if (user.role === 'parent') {
        window.location.href = 'parent-dashboard.html';
      } else if (user.role === 'admin') {
        window.location.href = 'admin-dashboard.html';
      }
    }

    // استعادة الدور المحفوظ
    const savedRole = localStorage.getItem('selectedRole') || 'student';
    selectRole(savedRole);
  </script>
  <script src="js/content-protection.js"></script>
</body>
</html>
