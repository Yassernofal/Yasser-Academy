<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الطالب – Mr. Yasser Nofal Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'El Messiri', serif;
      background: #f0f4fa;
      padding-top: 78px;
      min-height: 100vh;
    }
    @media (max-width: 991.98px) { body { padding-top: 72px; } }

    .navbar-custom {
      background: rgba(10, 31, 68, 0.85) !important;
      backdrop-filter: blur(18px);
      padding: 14px 0;
      box-shadow: 0 4px 30px rgba(0,0,0,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      z-index: 1050;
    }
    .navbar-brand { display: flex; align-items: center; gap: 10px; direction: ltr; }
    .navbar-brand img { height: 40px; width: auto; }
    .navbar-brand .brand-name {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: #f7e05e;
      letter-spacing: 1px;
    }
    .navbar-brand .brand-name span { color: #ffb347; }
    .nav-link { color: #e0e8f0 !important; font-weight: 500; transition: 0.3s; }
    .nav-link:hover { color: #f7e05e !important; }
    .nav-link.active { color: #f7e05e !important; }

    .dashboard-container {
      max-width: 800px;
      margin: 30px auto;
      background: #fff;
      border-radius: 28px;
      padding: 35px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }
    .stat-card {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      height: 100%;
    }
    .stat-card .number { font-size: 2.5rem; font-weight: 800; color: #0a1f44; }
    .stat-card .label { color: #666; }

    .btn-logout {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 10px 30px;
      border-radius: 50px;
      font-weight: 700;
      transition: 0.3s;
    }
    .btn-logout:hover { background: #b02a37; transform: scale(1.02); }

    footer {
      background: #0a1f44;
      color: #b0c4de;
      padding: 35px 0;
      border-radius: 40px 40px 0 0;
      margin-top: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ===== شريط التنقل ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo" />
        <span class="brand-name">Mr. <span>Yasser</span> Nofal</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="nav_home">🏠 الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="levels.html" data-i18n="nav_levels">📚 المستويات</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html" data-i18n="nav_booking">📝 الحجز</a></li>
          <li class="nav-item"><a class="nav-link" href="games.html" data-i18n="nav_games">🎮 الألعاب</a></li>
          <li class="nav-item"><a class="nav-link active" href="student-dashboard.html" data-i18n="nav_student">👨‍🎓 لوحة الطالب</a></li>
          <li class="nav-item"><a class="nav-link" href="parent-dashboard.html" data-i18n="nav_parent">👨‍👧 ولي الأمر</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html" data-i18n="nav_login">🔑 تسجيل الدخول</a></li>
          <!-- ===== زر اللغة ===== -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="langDropdown" role="button" data-bs-toggle="dropdown">
              🌐
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><button class="dropdown-item lang-btn" data-lang="ar" onclick="switchLanguage('ar')">🇸🇦 العربية</button></li>
              <li><button class="dropdown-item lang-btn" data-lang="en" onclick="switchLanguage('en')">🇬🇧 English</button></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== لوحة الطالب ===== -->
  <section class="container">
    <div class="dashboard-container">
      <h2 class="text-center fw-bold mb-4" data-i18n="student_dashboard_title">لوحة الطالب</h2>
      <p class="text-center text-muted" data-i18n="student_welcome">مرحباً، أحمد!</p>

      <div class="row g-4 mb-4">
        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="number">3</div>
            <div class="label" data-i18n="student_level">المستوى الحالي</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="number">70%</div>
            <div class="label" data-i18n="student_progress">نسبة التقدم</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="number">86%</div>
            <div class="label" data-i18n="student_grade">الدرجة الإجمالية</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card">
            <div class="number">2</div>
            <div class="label" data-i18n="student_certificates">الشهادات</div>
          </div>
        </div>
      </div>

      <button class="btn-logout w-100" onclick="logout()" data-i18n="student_logout"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    </div>
  </section>

  <!-- ===== الفوتر ===== -->
  <footer>
    <div class="container"><p class="mb-0" data-i18n="footer_copyright">© 2026 Mr. Yasser Nofal Academy – جميع الحقوق محفوظة</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/lang.js"></script>
  <script>
    function logout() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
