<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 2 – Pre-KG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --primary: #ff6b6b; --secondary: #4ecdc4; --accent: #ffe66d; --light-bg: #f9f9f9; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Comic Neue', cursive; background: var(--light-bg); direction: ltr; text-align: left; }
    .navbar-custom { background: #2d3436 !important; padding: 12px 0; }
    .navbar-brand { font-weight: 700; font-size: 1.6rem; color: #fff !important; }
    .navbar-brand span { color: var(--accent); }
    .nav-link { color: #fff !important; font-weight: 500; transition: 0.3s; }
    .nav-link:hover { color: var(--accent) !important; }
    .lesson-content { background: #fff; border-radius: 30px; padding: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); border: 2px solid #dfe6e9; }
    .number-box { font-size: 5rem; font-weight: 700; color: var(--primary); }
    .btn-sound { background: var(--accent); border: none; border-radius: 50px; padding: 10px 25px; font-weight: 700; transition: 0.3s; }
    .btn-sound:hover { transform: scale(1.05); }
    .back-btn { background: #2d3436; color: #fff; border: none; border-radius: 50px; padding: 10px 25px; font-weight: 700; transition: 0.3s; }
    .back-btn:hover { background: var(--primary); color: #fff; }
    footer { background: #2d3436; color: #ccc; padding: 35px 0; border-radius: 40px 40px 0 0; margin-top: 50px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo" style="height: 35px; margin-left: 10px;" />
        <span>Yasser</span> Nofal
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
          <li class="nav-item"><a class="nav-link" href="levels.html">📚 Levels</a></li>
          <li class="nav-item"><a class="nav-link" href="pre-kg-lessons.html">📖 Pre-KG Lessons</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">🔑 Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container py-5">
    <div class="lesson-content">
      <h1 class="text-center" style="font-size: 2.8rem; font-weight: 700;">🔢 Lesson 2: Numbers 1, 2, 3</h1>
      <div class="row g-4 mt-3">
        <div class="col-md-4 text-center">
          <div class="number-box">1</div>
          <img src="https://cdn-icons-png.flaticon.com/512/181/181549.png" alt="One" style="width: 80px; height: 80px; object-fit: contain;" />
          <div style="font-size: 1.5rem; font-weight: 700;">One</div>
          <button class="btn-sound mt-2" onclick="speak('One')"><i class="fas fa-volume-up"></i> Listen</button>
        </div>
        <div class="col-md-4 text-center">
          <div class="number-box">2</div>
          <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Two" style="width: 80px; height: 80px; object-fit: contain;" />
          <div style="font-size: 1.5rem; font-weight: 700;">Two</div>
          <button class="btn-sound mt-2" onclick="speak('Two')"><i class="fas fa-volume-up"></i> Listen</button>
        </div>
        <div class="col-md-4 text-center">
          <div class="number-box">3</div>
          <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Three" style="width: 80px; height: 80px; object-fit: contain;" />
          <div style="font-size: 1.5rem; font-weight: 700;">Three</div>
          <button class="btn-sound mt-2" onclick="speak('Three')"><i class="fas fa-volume-up"></i> Listen</button>
        </div>
      </div>
      <div class="mt-4"><div class="ratio ratio-16x9"><video controls><source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />Your browser does not support the video tag.</video></div></div>
      <div class="text-center mt-4"><button class="back-btn" onclick="window.location.href='pre-kg-lessons.html'">⬅ Back to Lessons</button></div>
    </div>
  </section>

  <footer class="text-center"><div class="container"><p class="mb-0">© 2026 Mr. Yasser Nofal Academy – All Rights Reserved</p></div></footer>

  <script>
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.8;
      speechSynthesis.speak(utterance);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/content-protection.js"></script>
</body>
</html>
