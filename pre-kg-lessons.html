<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre-KG Lessons – Mr. Yasser Nofal Academy</title>
  <meta name="description" content="Fun and interactive Pre-KG lessons for kids. Learn letters, numbers, and colors with Mr. Yasser Nofal Academy." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #6c5ce7;
      --secondary: #00b894;
      --accent: #fdcb6e;
      --dark: #2d3436;
      --light: #f8f9fa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--light);
      direction: ltr;
      text-align: left;
    }
    .navbar-custom {
      background: var(--dark) !important;
      padding: 15px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.6rem;
      color: #fff !important;
    }
    .navbar-brand span { color: var(--accent); }
    .nav-link {
      color: #fff !important;
      font-weight: 600;
      transition: 0.3s;
    }
    .nav-link:hover { color: var(--accent) !important; }

    .hero-lesson {
      background: linear-gradient(135deg, #a29bfe 0%, #fd79a8 100%);
      padding: 80px 0 60px;
      text-align: center;
      border-radius: 0 0 50px 50px;
      position: relative;
      overflow: hidden;
    }
    .hero-lesson::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hero-lesson h1 {
      font-size: 3.8rem;
      font-weight: 700;
      color: #fff;
      position: relative;
      z-index: 1;
    }
    .hero-lesson p {
      font-size: 1.4rem;
      color: #fff;
      position: relative;
      z-index: 1;
    }

    .lesson-card {
      background: #fff;
      border-radius: 30px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      transition: all 0.4s ease;
      height: 100%;
      border-bottom: 5px solid var(--secondary);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .lesson-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      opacity: 0;
      transition: 0.4s;
      z-index: 0;
    }
    .lesson-card:hover::after { opacity: 0.05; }
    .lesson-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 50px rgba(108, 92, 231, 0.2);
      border-color: var(--primary);
    }
    .lesson-card .lesson-icon {
      font-size: 3.5rem;
      position: relative;
      z-index: 1;
    }
    .lesson-card .lesson-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dark);
      position: relative;
      z-index: 1;
    }
    .lesson-card .lesson-desc {
      color: #636e72;
      position: relative;
      z-index: 1;
    }

    footer {
      background: var(--dark);
      color: #ccc;
      padding: 40px 0;
      border-radius: 50px 50px 0 0;
      margin-top: 60px;
    }

    @media (max-width: 768px) {
      .hero-lesson h1 { font-size: 2.5rem; }
      .lesson-card { padding: 20px 15px; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo" style="height: 35px; margin-left: 10px;" />
        <span>Yasser</span> Nofal
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
          <li class="nav-item"><a class="nav-link" href="levels.html">📚 Levels</a></li>
          <li class="nav-item"><a class="nav-link" href="pre-kg-lessons.html">📖 Pre-KG</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">🔑 Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero-lesson">
    <div class="container" data-aos="fade-up">
      <h1>🌈 Pre-KG Lessons</h1>
      <p>Fun and interactive lessons for little learners</p>
    </div>
  </section>

  <!-- Lessons -->
  <section class="container py-5">
    <div class="row g-4">
      <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
        <div class="lesson-card" onclick="window.location.href='pre-kg-lesson1.html'">
          <div class="lesson-icon">🔤</div>
          <div class="lesson-title">Lesson 1</div>
          <div class="lesson-desc">Letters A, B, C</div>
        </div>
      </div>
      <div class="col-md-4" data-aos="fade-up" data-aos-delay="200">
        <div class="lesson-card" onclick="window.location.href='pre-kg-lesson2.html'">
          <div class="lesson-icon">🔢</div>
          <div class="lesson-title">Lesson 2</div>
          <div class="lesson-desc">Numbers 1, 2, 3</div>
        </div>
      </div>
      <div class="col-md-4" data-aos="fade-up" data-aos-delay="300">
        <div class="lesson-card" onclick="window.location.href='pre-kg-lesson3.html'">
          <div class="lesson-icon">🎨</div>
          <div class="lesson-title">Lesson 3</div>
          <div class="lesson-desc">Colors Red, Blue, Yellow</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center">
    <div class="container">
      <p class="mb-0">© 2026 Mr. Yasser Nofal Academy – All Rights Reserved</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true });
  </script>
  <script src="js/content-protection.js"></script>
</body>
</html>
