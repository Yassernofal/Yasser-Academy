<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre-KG Lessons – Mr. Yasser Nofal Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #ff6b6b;
      --secondary: #4ecdc4;
      --accent: #ffe66d;
      --light-bg: #f9f9f9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Comic Neue', cursive;
      background: var(--light-bg);
      direction: ltr;
    }
    .navbar-custom { background: #2d3436 !important; padding: 12px 0; }
    .navbar-brand { font-weight: 700; font-size: 1.6rem; color: #fff !important; }
    .navbar-brand span { color: var(--accent); }
    .nav-link { color: #fff !important; font-weight: 500; transition: 0.3s; }
    .nav-link:hover { color: var(--accent) !important; }

    .hero-lesson {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      padding: 60px 0;
      text-align: center;
      border-radius: 0 0 40px 40px;
    }
    .hero-lesson h1 { font-size: 3.5rem; font-weight: 700; color: #2d3436; }
    .hero-lesson p { font-size: 1.4rem; color: #2d3436; }

    .letter-card {
      background: #fff;
      border-radius: 30px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      transition: 0.3s;
      height: 100%;
      border: 4px solid #dfe6e9;
    }
    .letter-card:hover { transform: scale(1.02); border-color: var(--secondary); }
    .letter-card .letter { font-size: 5rem; font-weight: 700; color: var(--primary); }
    .letter-card img { width: 80px; height: 80px; object-fit: contain; margin: 10px 0; }
    .letter-card .word { font-size: 1.8rem; font-weight: 700; color: #2d3436; }
    .letter-card .btn-sound { background: var(--accent); border: none; border-radius: 50px; padding: 10px 25px; font-weight: 700; }

    .video-section {
      background: #2d3436;
      padding: 40px;
      border-radius: 30px;
      margin-top: 40px;
    }
    .video-section h3 { color: #fff; margin-bottom: 20px; }

    footer { background: #2d3436; color: #ccc; padding: 35px 0; border-radius: 40px 40px 0 0; margin-top: 50px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo" style="height: 35px; margin-left: 10px;" />
        <span>Yasser</span> Nofal
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 Home</a></li>
          <li class="nav-item"><a class="nav-link" href="levels.html">📚 Levels</a></li>
          <li class="nav-item"><a class="nav-link" href="pre-kg-lessons.html">📖 Pre-KG Lessons</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">🔑 Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero-lesson">
    <div class="container">
      <h1>🌈 Pre-KG Lessons</h1>
      <p>Learn letters, numbers, and colors with fun!</p>
    </div>
  </section>

  <!-- Letters Section -->
  <section class="container py-5">
    <h2 class="text-center mb-5" style="font-size: 2.8rem; font-weight: 700;">🔤 Lesson 1: Letters A, B, C</h2>
    <div class="row g-4">
      <!-- Letter A -->
      <div class="col-md-4">
        <div class="letter-card">
          <div class="letter">A</div>
          <img src="https://cdn-icons-png.flaticon.com/512/181/181549.png" alt="Apple" />
          <div class="word">Apple</div>
          <button class="btn btn-sound mt-2" onclick="speak('Apple')"><i class="fas fa-volume-up"></i> Listen</button>
        </div>
      </div>
      <!-- Letter B -->
      <div class="col-md-4">
        <div class="letter-card">
          <div class="letter">B</div>
          <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Ball" />
          <div class="word">Ball</div>
          <button class="btn btn-sound mt-2" onclick="speak('Ball')"><i class="fas fa-volume-up"></i> Listen</button>
        </div>
      </div>
      <!-- Letter C -->
      <div class="col-md-4">
        <div class="letter-card">
          <div class="letter">C</div>
          <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Cat" />
          <div class="word">Cat</div>
          <button class="btn btn-sound mt-2" onclick="speak('Cat')"><i class="fas fa-volume-up"></i> Listen</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Video Section -->
  <section class="container">
    <div class="video-section">
      <h3>🎥 Watch the Video</h3>
      <div class="ratio ratio-16x9">
        <iframe src="https://www.youtube.com/embed/8W9L2COrM_8" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center">
    <div class="container">
      <p class="mb-0">© 2026 Mr. Yasser Nofal Academy – All Rights Reserved</p>
    </div>
  </footer>

  <script>
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.8;
      speechSynthesis.speak(utterance);
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/content-protection.js"></script>
</body>
</html>
