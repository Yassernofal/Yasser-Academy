<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الامتحانات – أكاديمية مستر ياسر نوفل</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Lateef:wght@400;700&display=swap" rel="stylesheet" />

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'El Messiri', 'Lateef', serif; background: #f0f4fa; padding-top: 20px; padding-bottom: 40px; }

    .navbar-custom {
      background: rgba(10, 31, 68, 0.95) !important;
      backdrop-filter: blur(18px);
      padding: 14px 0;
      box-shadow: 0 4px 30px rgba(0,0,0,0.15);
    }
    .navbar-brand { display: flex; align-items: center; gap: 10px; direction: ltr; }
    .navbar-brand .brand-name {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: #f7e05e;
    }
    .nav-link { color: #e0e8f0 !important; font-weight: 500; }
    .nav-link:hover { color: #f7e05e !important; }
    .nav-link.active { color: #f7e05e !important; }

    .page-header {
      background: linear-gradient(135deg, #0a1f44, #1e3a8a);
      color: #fff;
      padding: 40px 30px;
      border-radius: 24px;
      margin-bottom: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(10, 31, 68, 0.3);
    }
    .page-header h1 { font-weight: 700; color: #f7e05e; margin-bottom: 10px; }
    .page-header p { color: #b0c4de; margin: 0; }

    .filter-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .filter-tab {
      padding: 10px 24px;
      border-radius: 50px;
      background: #fff;
      border: 2px solid #e0e0e0;
      color: #0a1f44;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }
    .filter-tab:hover { border-color: #f7b731; }
    .filter-tab.active { background: #0a1f44; color: #f7e05e; border-color: #0a1f44; }

    .exam-card {
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.07);
      transition: 0.3s;
      height: 100%;
      border-right: 4px solid #f7e05e;
      display: flex;
      flex-direction: column;
    }
    .exam-card:hover { transform: translateY(-5px); box-shadow: 0 12px 35px rgba(0,0,0,0.12); }

    .exam-type-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .badge-unit { background: #e3f2fd; color: #1565c0; }
    .badge-comprehensive { background: #fff3e0; color: #ef6c00; }
    .badge-level { background: #f3e5f5; color: #6a1b9a; }
    .badge-practice { background: #e8f5e9; color: #2e7d32; }

    .exam-card h5 { color: #0a1f44; font-weight: 700; margin-bottom: 15px; }

    .exam-info {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      color: #666;
      font-size: 0.9rem;
    }
    .exam-info span { display: flex; align-items: center; gap: 5px; }

    .random-badge {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 12px;
    }

    .btn-start-exam {
      background: #0a1f44;
      color: #f7e05e;
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-weight: 700;
      transition: 0.3s;
      margin-top: auto;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .btn-start-exam:hover { background: #f7b731; color: #0a1f44; transform: scale(1.02); }

    .score-badge {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      color: #0a1f44;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .empty-state { text-align: center; padding: 60px 20px; color: #666; }
    .empty-state i { font-size: 5rem; color: #ccc; margin-bottom: 20px; }
    .loading-screen { text-align: center; padding: 80px 20px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-name">Mr. Yasser Nofal</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link active" href="exams.html">📝 الامتحانات</a></li>
          <li class="nav-item"><a class="nav-link" href="student-dashboard.html">👨‍🎓 لوحتي</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="logoutUser()">🚪 تسجيل الخروج</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4" style="max-width: 1100px;">

    <div class="page-header">
      <h1><i class="fas fa-file-alt"></i> الامتحانات</h1>
      <p>اختر الامتحان الذي تريد أداءه</p>
    </div>

    <div id="loadingScreen" class="loading-screen">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
      <p class="mt-3">جاري تحميل الامتحانات...</p>
    </div>

    <div id="filtersSection" class="filter-tabs" style="display: none;">
      <button class="filter-tab active" onclick="filterExams('all', this)">كل الامتحانات</button>
      <button class="filter-tab" onclick="filterExams('unit', this)">امتحانات الوحدات</button>
      <button class="filter-tab" onclick="filterExams('comprehensive', this)">امتحانات شاملة</button>
      <button class="filter-tab" onclick="filterExams('level', this)">امتحانات المستوى</button>
      <button class="filter-tab" onclick="filterExams('practice', this)">امتحانات تدريبية</button>
    </div>

    <div id="examsContainer" class="row g-4"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <i class="fas fa-inbox"></i>
      <h3>لا توجد امتحانات متاحة حالياً</h3>
      <p>سيتم إضافة الامتحانات قريباً. تابعنا!</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { auth, database } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "firebase/auth";
    import { ref, get } from "firebase/database";
    import { getAllExams, getStudentResults } from './assets/js/exam-storage.js';

    let currentUser = null;
    let currentGrade = null;
    let allExams = [];
    let studentResults = {};

    window.logoutUser = function() {
      signOut(auth).then(() => window.location.href = 'index.html');
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      await loadData();
    });

    async function loadData() {
      try {
        const studentSnap = await get(ref(database, `students/${currentUser.uid}`));
        if (studentSnap.exists()) {
          const data = studentSnap.val();
          currentGrade = data.grade || 'prep1';
        } else {
          currentGrade = 'prep1';
        }

        const exams = await getAllExams();
        allExams = exams.filter(e => e.grade === currentGrade && e.active !== false);

        const results = await getStudentResults(currentUser.uid);
        results.forEach(r => { studentResults[r.examId] = r; });

        document.getElementById('loadingScreen').style.display = 'none';
        
        if (allExams.length === 0) {
          document.getElementById('emptyState').style.display = 'block';
        } else {
          document.getElementById('filtersSection').style.display = 'flex';
          renderExams(allExams);
        }

      } catch (error) {
        console.error('❌ خطأ:', error);
        document.getElementById('loadingScreen').innerHTML = `
          <div class="alert alert-danger">حدث خطأ في تحميل الامتحانات: ${error.message}</div>
        `;
      }
    }

    function renderExams(exams) {
      const container = document.getElementById('examsContainer');
      container.innerHTML = '';

      if (exams.length === 0) {
        container.innerHTML = `<div class="col-12"><div class="empty-state"><i class="fas fa-search"></i><p>لا توجد امتحانات في هذا التصنيف</p></div></div>`;
        return;
      }

      const typeLabels = { 
        unit: 'امتحان وحدة', 
        comprehensive: 'امتحان شامل', 
        level: 'امتحان مستوى',
        practice: 'امتحان تدريبي'
      };

      exams.forEach(exam => {
        const result = studentResults[exam.id];
        const isDone = !!result;
        const typeBadge = exam.type || 'comprehensive';
        
        // ✅ إصلاح عدد الأسئلة - يدعم النظام العشوائي
        let qCount = 0;
        if (exam.isRandom) {
          qCount = exam.questionCount || 0;
        } else if (exam.questions && Array.isArray(exam.questions)) {
          qCount = exam.questions.length;
        } else if (exam.questionCount) {
          qCount = exam.questionCount;
        }
        
        const duration = exam.duration || 30;

        const card = document.createElement('div');
        card.className = 'col-md-6 col-lg-4';
        card.innerHTML = `
          <div class="exam-card">
            <span class="exam-type-badge badge-${typeBadge}">${typeLabels[typeBadge] || 'امتحان'}</span>
            ${exam.isRandom ? '<span class="random-badge"><i class="fas fa-random"></i> أسئلة عشوائية</span>' : ''}
            <h5>${exam.title || 'امتحان بدون عنوان'}</h5>
            
            ${isDone ? `<div class="score-badge"><i class="fas fa-check-circle" style="color: #28a745;"></i> نتيجتك: ${result.percentage}% — ${result.grade}</div>` : ''}

            <div class="exam-info">
              <span><i class="fas fa-question-circle"></i> ${qCount} سؤال</span>
              <span><i class="fas fa-clock"></i> ${duration} دقيقة</span>
            </div>

            ${isDone 
              ? `<a href="exam-results.html?id=${exam.id}" class="btn btn-start-exam" style="background: #28a745; color: #fff;"><i class="fas fa-chart-line"></i> عرض النتيجة</a>`
              : `<a href="exam.html?id=${exam.id}" class="btn btn-start-exam"><i class="fas fa-play"></i> ابدأ الامتحان</a>`
            }
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.filterExams = function(type, btn) {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const filtered = type === 'all' ? allExams : allExams.filter(e => e.type === type);
      renderExams(filtered);
    };

    console.log('✅ Exams page loaded with random support');
  </script>

</body>
</html>
