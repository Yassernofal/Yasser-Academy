<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار الاتصال</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body style="font-family: Arial; padding: 50px; text-align: center;">

  <h2>جاري فحص الاتصال بقاعدة البيانات...</h2>
  <h3 id="result" style="color: red;">انتظر...</h3>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFuAjSYHumAxJ_98AbYxFI8N9dSd27xL8",
      authDomain: "yasser-nofal-english-academy.firebaseapp.com",
      databaseURL: "https://yasser-nofal-english-academy-default-rtdb.firebaseio.com",
      projectId: "yasser-nofal-english-academy",
      storageBucket: "yasser-nofal-english-academy.firebasestorage.app",
      messagingSenderId: "654488740819",
      appId: "1:654488740819:web:7a513cb6c2a74d98324526"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      const res = document.getElementById('result');
      if (!user) {
        res.innerText = "❌ أنت غير مسجل دخول. يرجى تسجيل الدخول أولاً.";
        res.style.color = "red";
        return;
      }

      // فحص إذا كان أدمن
      db.ref('users/' + user.uid).once('value').then(snap => {
        if (snap.exists() && snap.val().role === 'admin') {
          res.innerText = "✅ أنت مسجل دخول كأدمن. (الاتصال بقاعدة البيانات شغال)";
          res.style.color = "green";
        } else {
          res.innerText = "⚠️ أنت مسجل دخول، لكن حسابك ليس أدمن في جدول users.";
          res.style.color = "orange";
        }
      }).catch(err => {
        res.innerText = "❌ خطأ في قراءة البيانات: " + err.message;
        res.style.color = "red";
      });
    });
  </script>
</body>
</html>
