<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاشتراك - أكاديمية مستر ياسر نوفل</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&display=swap" rel="stylesheet" />
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'El Messiri', sans-serif; background: #f0f4fa; padding-top: 50px; }
    .card-pay { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    .card-pay h2 { color: #0a1f44; font-weight: 800; text-align: center; margin-bottom: 30px; }
    .pay-method { background: #f8f9fa; border: 2px dashed #1a3a6e; border-radius: 15px; padding: 20px; margin-bottom: 20px; text-align: center; }
    .pay-method h5 { color: #1a3a6e; font-weight: 700; }
    .pay-method p { margin: 0; font-size: 1.2rem; font-weight: 700; color: #f7b731; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card-pay">
      <h2><i class="fas fa-crown text-warning"></i> اشترك الآن</h2>
      <p class="text-center text-muted mb-4">لتفعيل حسابك والوصول إلى جميع الوحدات والامتحانات، يرجى تحويل قيمة الاشتراك.</p>

      <!-- ====== هنا تحط أرقامك ====== -->
      
      <div class="pay-method">
        <h5><i class="fas fa-mobile-alt"></i> فودافون كاش</h5>
        <!-- استبدل النص اللي تحت ده برقم الفودافون كاش بتاعك -->
        <p>[01001297414]</p> 
      </div>

      <div class="pay-method">
        <h5><i class="fas fa-university"></i> إنستاباي (InstaPay)</h5>
        <!-- استبدل النص اللي تحت ده برقم الإنستاباي بتاعك -->
        <p>[01203145717]</p> 
      </div>

      <!-- ============================= -->

      <hr>

      <form id="subscribeForm">
        <div class="mb-3">
          <label class="form-label fw-bold">اسمك بالكامل</label>
          <input type="text" class="form-control" id="studentName" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">رقم الهاتف الذي حولت منه</label>
          <input type="text" class="form-control" id="senderPhone" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">رقم عملية التحويل (Transaction ID)</label>
          <input type="text" class="form-control" id="txnId" required />
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold py-3 mt-3" style="border-radius: 50px;">
          <i class="fas fa-paper-plane"></i> إرسال طلب الاشتراك
        </button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFuAjSYHumAxJ_98AbYxFI8N9dSd27xL8",
      authDomain: "yasser-nofal-english-academy.firebaseapp.com",
      databaseURL: "https://yasser-nofal-english-academy-default-rtdb.firebaseio.com",
      projectId: "yasser-nofal-english-academy",
      storageBucket: "yasser-nofal-english-academy.firebasestorage.app",
      messagingSenderId: "654488740819",
      appId: "1:654488740819:web:7a513cb6c2a74d98324526"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (!user) {
        alert('يجب تسجيل الدخول أولاً للاشتراك.');
        window.location.href = 'login.html';
      }
    });

    document.getElementById('subscribeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const name = document.getElementById('studentName').value;
      const phone = document.getElementById('senderPhone').value;
      const txn = document.getElementById('txnId').value;

      const btn = this.querySelector('button');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
      btn.disabled = true;

      db.ref('payment_requests/' + user.uid).set({
        name: name,
        phone: phone,
        txnId: txn,
        email: user.email,
        status: 'pending',
        date: new Date().toISOString()
      }).then(() => {
        alert('✅ تم إرسال طلبك بنجاح! سيتم تفعيل اشتراكك خلال 24 ساعة.');
        window.location.href = 'student-dashboard.html';
      }).catch(err => {
        alert('حدث خطأ: ' + err.message);
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال طلب الاشتراك';
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
