<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ألعاب تعليمية – Mr. Yasser Nofal Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'El Messiri', serif;
      background: linear-gradient(135deg, #f0f4fa 0%, #d9e2ef 100%);
      padding-top: 78px;
      min-height: 100vh;
    }
    @media (max-width: 991.98px) { body { padding-top: 72px; } }

    /* ===== نفس الـ Navbar من الموقع ===== */
    .navbar-custom {
      background: rgba(10, 31, 68, 0.85) !important;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 14px 0;
      box-shadow: 0 4px 30px rgba(0,0,0,0.15);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      z-index: 1050;
    }
    .navbar-brand { display: flex; align-items: center; gap: 10px; direction: ltr; }
    .navbar-brand img { height: 40px; width: auto; }
    .navbar-brand .brand-name {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: #f7e05e;
      letter-spacing: 1px;
    }
    .navbar-brand .brand-name span { color: #ffb347; }
    .nav-link { color: #e0e8f0 !important; font-weight: 500; transition: 0.3s; }
    .nav-link:hover { color: #f7e05e !important; }
    .nav-link.active { color: #f7e05e !important; }

    /* ===== محتوى اللعبة ===== */
    .game-container {
      max-width: 800px;
      margin: 30px auto;
      background: #fff;
      border-radius: 28px;
      padding: 35px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.1);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .game-header .score {
      font-size: 1.3rem;
      font-weight: 700;
      background: #0a1f44;
      color: #f7e05e;
      padding: 8px 20px;
      border-radius: 50px;
    }
    .game-header .question-counter {
      font-size: 1.1rem;
      color: #555;
    }

    .image-box {
      background: #f8f9fa;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      margin-bottom: 25px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #dee2e6;
    }
    .image-box .emoji-display {
      font-size: 6rem;
      line-height: 1;
    }
    .image-box .word-hint {
      font-size: 0.9rem;
      color: #888;
      margin-top: 10px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 20px 0;
    }
    .options-grid .option-btn {
      padding: 15px;
      border: 3px solid #dee2e6;
      border-radius: 16px;
      background: #fff;
      font-size: 1.2rem;
      font-weight: 600;
      transition: 0.3s;
      cursor: pointer;
      font-family: 'El Messiri', serif;
    }
    .options-grid .option-btn:hover {
      border-color: #0a1f44;
      background: #f8f9fa;
      transform: scale(1.02);
    }
    .options-grid .option-btn.correct {
      border-color: #28a745;
      background: #d4edda;
      color: #155724;
    }
    .options-grid .option-btn.wrong {
      border-color: #dc3545;
      background: #f8d7da;
      color: #721c24;
    }
    .options-grid .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .game-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-next {
      background: #0a1f44;
      color: #f7e05e;
      border: none;
      padding: 12px 35px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      transition: 0.3s;
      font-family: 'El Messiri', serif;
    }
    .btn-next:hover {
      background: #f7e05e;
      color: #0a1f44;
      transform: scale(1.03);
    }
    .btn-next:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-box {
      text-align: center;
      padding: 30px;
      background: #e8f4fd;
      border-radius: 20px;
      margin-top: 20px;
    }
    .result-box .final-score {
      font-size: 3rem;
      font-weight: 800;
      color: #0a1f44;
    }
    .result-box .final-message {
      font-size: 1.2rem;
      margin: 10px 0;
    }

    footer {
      background: #0a1f44;
      color: #b0c4de;
      padding: 35px 0;
      border-radius: 40px 40px 0 0;
      margin-top: 50px;
      text-align: center;
    }

    @media (max-width: 576px) {
      .game-container { padding: 20px; }
      .options-grid { grid-template-columns: 1fr; }
      .image-box .emoji-display { font-size: 4rem; }
    }
  </style>
</head>
<body>

  <!-- ===== شريط التنقل ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo" />
        <span class="brand-name">Mr. <span>Yasser</span> Nofal</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="levels.html">📚 المستويات</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">📝 الحجز</a></li>
          <li class="nav-item"><a class="nav-link active" href="games.html">🎮 الألعاب</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">🔑 تسجيل الدخول</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== اللعبة ===== -->
  <section class="container">
    <div class="game-container" id="gameContainer">
      <!-- رأس اللعبة -->
      <div class="game-header">
        <div class="score">⭐ <span id="scoreDisplay">0</span></div>
        <div class="question-counter" id="questionCounter">السؤال 1 من 10</div>
        <button class="btn btn-sm btn-outline-danger" onclick="resetGame()">
          <i class="fas fa-redo"></i> إعادة
        </button>
      </div>

      <!-- منطقة السؤال -->
      <div id="questionArea">
        <div class="image-box">
          <div>
            <div class="emoji-display" id="emojiDisplay">🐱</div>
            <div class="word-hint">اختر الكلمة الصحيحة للصورة</div>
          </div>
        </div>

        <div class="options-grid" id="optionsContainer">
          <button class="option-btn" data-index="0" onclick="selectOption(0)">Cat</button>
          <button class="option-btn" data-index="1" onclick="selectOption(1)">Dog</button>
          <button class="option-btn" data-index="2" onclick="selectOption(2)">Bird</button>
          <button class="option-btn" data-index="3" onclick="selectOption(3)">Fish</button>
        </div>
      </div>

      <!-- زرار التالي -->
      <div class="game-footer">
        <div></div>
        <button class="btn-next" id="nextBtn" disabled onclick="nextQuestion()">
          <i class="fas fa-arrow-left"></i> السؤال التالي
        </button>
      </div>

      <!-- نتيجة النهاية (مخفية في البداية) -->
      <div id="resultArea" style="display: none;">
        <div class="result-box">
          <h3>🎉 انتهت اللعبة!</h3>
          <div class="final-score" id="finalScore">0</div>
          <div class="final-message" id="finalMessage">أحسنت! واصل التدريب 💪</div>
          <button class="btn btn-primary mt-3" onclick="resetGame()">
            <i class="fas fa-play"></i> العب مرة أخرى
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== الفوتر ===== -->
  <footer>
    <div class="container"><p class="mb-0">© 2026 Mr. Yasser Nofal Academy – جميع الحقوق محفوظة</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ===== بنك الأسئلة (إضافة أو تعديل بكل سهولة) =====
    const questions = [
      { emoji: '🐱', correct: 'Cat', options: ['Cat', 'Dog', 'Bird', 'Fish'] },
      { emoji: '🐶', correct: 'Dog', options: ['Cat', 'Dog', 'Bird', 'Fish'] },
      { emoji: '🐦', correct: 'Bird', options: ['Cat', 'Dog', 'Bird', 'Fish'] },
      { emoji: '🐟', correct: 'Fish', options: ['Cat', 'Dog', 'Bird', 'Fish'] },
      { emoji: '🐮', correct: 'Cow', options: ['Cow', 'Horse', 'Sheep', 'Goat'] },
      { emoji: '🐴', correct: 'Horse', options: ['Cow', 'Horse', 'Sheep', 'Goat'] },
      { emoji: '🐑', correct: 'Sheep', options: ['Cow', 'Horse', 'Sheep', 'Goat'] },
      { emoji: '🐐', correct: 'Goat', options: ['Cow', 'Horse', 'Sheep', 'Goat'] },
      { emoji: '🍎', correct: 'Apple', options: ['Apple', 'Banana', 'Orange', 'Grapes'] },
      { emoji: '🍌', correct: 'Banana', options: ['Apple', 'Banana', 'Orange', 'Grapes'] },
      { emoji: '🍊', correct: 'Orange', options: ['Apple', 'Banana', 'Orange', 'Grapes'] },
      { emoji: '🍇', correct: 'Grapes', options: ['Apple', 'Banana', 'Orange', 'Grapes'] },
    ];

    // ===== متغيرات اللعبة =====
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;

    // ===== خلط الأسئلة (عشان كل مرة تظهر بشكل مختلف) =====
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // ===== بدء اللعبة =====
    function startGame() {
      // اختيار 10 أسئلة عشوائية من البنك
      const shuffled = shuffleArray([...questions]);
      currentQuestions = shuffled.slice(0, 10);
      currentIndex = 0;
      score = 0;
      isAnswered = false;
      document.getElementById('resultArea').style.display = 'none';
      document.getElementById('questionArea').style.display = 'block';
      document.getElementById('nextBtn').disabled = true;
      renderQuestion();
    }

    // ===== عرض السؤال =====
    function renderQuestion() {
      if (currentIndex >= currentQuestions.length) {
        endGame();
        return;
      }

      const q = currentQuestions[currentIndex];
      document.getElementById('emojiDisplay').textContent = q.emoji;
      document.getElementById('questionCounter').textContent = `السؤال ${currentIndex + 1} من ${currentQuestions.length}`;
      document.getElementById('scoreDisplay').textContent = score;

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';
      
      // خلط الخيارات عشان تظهر بشكل مختلف
      const shuffledOptions = shuffleArray([...q.options]);
      shuffledOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.dataset.index = idx;
        btn.onclick = () => selectOption(opt);
        optionsContainer.appendChild(btn);
      });

      isAnswered = false;
      document.getElementById('nextBtn').disabled = true;
    }

    // ===== اختيار الإجابة =====
    function selectOption(selected) {
      if (isAnswered) return;
      isAnswered = true;

      const q = currentQuestions[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');
      let isCorrect = false;

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.correct) {
          btn.classList.add('correct');
        }
        if (btn.textContent === selected && btn.textContent === q.correct) {
          isCorrect = true;
        }
        if (btn.textContent === selected && btn.textContent !== q.correct) {
          btn.classList.add('wrong');
        }
      });

      if (isCorrect) {
        score += 10;
        document.getElementById('scoreDisplay').textContent = score;
      }

      document.getElementById('nextBtn').disabled = false;
    }

    // ===== السؤال التالي =====
    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        endGame();
      }
    }

    // ===== نهاية اللعبة =====
    function endGame() {
      document.getElementById('questionArea').style.display = 'none';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('resultArea').style.display = 'block';
      document.getElementById('finalScore').textContent = score;

      let message = '';
      if (score >= 90) message = '🏆 ممتاز! أنت بطل اللعبة!';
      else if (score >= 70) message = '👍 جيد جداً! استمر في التدريب!';
      else if (score >= 50) message = '📖 جيد، لكن حاول أكثر!';
      else message = '💪 لا تستسلم! تدرب أكثر وستتحسن!';
      document.getElementById('finalMessage').textContent = message;
    }

    // ===== إعادة اللعبة =====
    function resetGame() {
      startGame();
    }

    // ===== تشغيل اللعبة عند تحميل الصفحة =====
    document.addEventListener('DOMContentLoaded', startGame);
  </script>
</body>
</html>
