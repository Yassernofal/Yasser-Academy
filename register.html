<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد - أكاديمية مستر ياسر نوفل</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <style>
    body { background: #f0f4fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'El Messiri', sans-serif; margin: 0; }
    .register-card { background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); }
    .register-card h2 { color: #0a1f44; font-weight: 800; margin-bottom: 5px; }
    .register-card p { color: #666; margin-bottom: 30px; font-size: 0.95rem; }
    .form-control, .form-select { border-radius: 12px; padding: 12px 15px; border: 2px solid #e9ecef; background-color: #f8f9fa; }
    .form-control:focus, .form-select:focus { border-color: #0a1f44; box-shadow: none; background-color: #fff; }
    .btn-register { background: #0a1f44; color: #f7e05e; padding: 14px; border-radius: 12px; font-weight: 800; width: 100%; border: none; transition: 0.3s; margin-top: 10px; font-size: 1.1rem; }
    .btn-register:hover { background: #f7b731; color: #0a1f44; }
    .login-link { text-align: center; margin-top: 20px; font-size: 0.9rem; }
    .login-link a { color: #0a1f44; font-weight: 700; text-decoration: none; }
    .login-link a:hover { color: #f7b731; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
  }
  </script>
</head>
<body>

  <div class="register-card">
    <div class="text-center mb-4">
      <a href="/index.html" style="text-decoration: none;">
        <h2>Mr. Yasser Nofal</h2>
      </a>
      <p>أنشئ حسابك وابدأ رحلة التفوق</p>
    </div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label fw-bold">الاسم بالكامل</label>
        <input type="text" class="form-control" id="fullName" required placeholder="اكتب اسمك الثلاثي">
      </div>
      
      <div class="mb-3">
        <label class="form-label fw-bold">رقم الموبايل</label>
        <input type="tel" class="form-control" id="phone" required placeholder="01xxxxxxxxx">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="email" required placeholder="example@email.com">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">الصف الدراسي</label>
        <select class="form-select" id="grade" required>
          <option value="" selected disabled>اختر صفك الدراسي</option>
          <option value="prep1">الأول الإعدادي</option>
          <option value="prep2">الثاني الإعدادي</option>
          <option value="prep3">الثالث الإعدادي</option>
          <option value="sec1">الأول الثانوي</option>
          <option value="sec2">الثاني الثانوي</option>
          <option value="sec3">الثالث الثانوي</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">كلمة المرور</label>
        <input type="password" class="form-control" id="password" required placeholder="6 أحرف على الأقل" minlength="6">
      </div>

      <button type="submit" class="btn-register" id="submitBtn">📝 إنشاء الحساب</button>
    </form>

    <div class="login-link">
      لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول</a>
    </div>
  </div>

  <script type="module">
    import { auth, database } from './firebase-config.js';
    import { createUserWithEmailAndPassword, sendEmailVerification } from "firebase/auth";
    import { ref, set } from "firebase/database";
    
    // استدعاء نظام الإشعارات اللي عملناه
    import { sendTelegramNotification } from '/assets/js/notify.js';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = 'جاري الإنشاء... ⏳';

      const name = document.getElementById('fullName').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const grade = document.getElementById('grade').value;
      const password = document.getElementById('password').value;

      try {
        // 1. إنشاء الحساب في Firebase Authentication
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 2. إرسال إيميل التفعيل
        await sendEmailVerification(user);

        // 3. حفظ بيانات الطالب في قاعدة البيانات
        await set(ref(database, 'students/' + user.uid), {
          name: name,
          phone: phone,
          email: email,
          grade: grade,
          role: 'student',
          createdAt: Date.now(),
          level: '1',
          progress: '0',
          grade_percentage: '0%',
          certificates: '0',
          lessonsCompleted: '0',
          subscriptionStatus: 'inactive' // الاشتراك غير مفعل في البداية
        });

        // 4. إرسال إشعار على تليجرام
        sendTelegramNotification(
          `🎓 <b>طالب جديد سجل في الأكاديمية!</b>\n\n` +
          `👤 الاسم: ${name}\n` +
          `📱 الموبايل: ${phone}\n` +
          `📧 الإيميل: ${email}\n` +
          `📚 الصف: ${grade}`
        );

        // 5. رسالة نجاح وتوجيه
        alert('✅ تم إنشاء حسابك بنجاح! يرجى مراجعة بريدك الإلكتروني لتفعيل الحساب.');
        window.location.href = '/login.html';

      } catch (error) {
        console.error(error);
        let errorMsg = 'حدث خطأ أثناء إنشاء الحساب.';
        if (error.code === 'auth/email-already-in-use') {
          errorMsg = 'هذا البريد الإلكتروني مسجل بالفعل. جرب تسجيل الدخول.';
        } else if (error.code === 'auth/weak-password') {
          errorMsg = 'كلمة المرور ضعيفة جداً. استخدم 6 أحرف على الأقل.';
        } else if (error.code === 'auth/invalid-email') {
          errorMsg = 'البريد الإلكتروني غير صالح.';
        }
        alert('❌ ' + errorMsg);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
