<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - أكاديمية مستر ياسر نوفل</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/theme.css">
  <style>
    body { background: #f0f4fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'El Messiri', sans-serif; margin: 0; padding: 20px 0; }
    .register-card { background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); }
    .form-control, .form-select { border-radius: 12px; padding: 12px 15px; border: 2px solid #e9ecef; background-color: #f8f9fa; }
    .form-control:focus, .form-select:focus { border-color: #0a1f44; box-shadow: none; background-color: #fff; }
    .btn-register { background: #0a1f44; color: #f7e05e; padding: 14px; border-radius: 12px; font-weight: 800; width: 100%; border: none; transition: 0.3s; margin-top: 10px; font-size: 1.1rem; }
    .btn-register:hover { background: #f7b731; color: #0a1f44; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
  }
  </script>
</head>
<body>

  <div class="register-card">
    <div class="text-center mb-4">
      <a href="./index.html" style="text-decoration: none;">
        <h2 style="color:#0a1f44; font-weight:800;">Mr. Yasser Nofal</h2>
      </a>
      <p class="text-muted">مرحباً بك في الأكاديمية.. أنشئ حسابك الآن</p>
    </div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label fw-bold">أنت تسجل بصفتك:</label>
        <select class="form-select" id="role" required>
          <option value="" selected disabled>اختر...</option>
          <option value="student">👨‍🎓 طالب</option>
          <option value="parent">👨‍👩‍👦 ولي أمر</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">الاسم بالكامل</label>
        <input type="text" class="form-control" id="fullName" required placeholder="اكتب اسمك">
      </div>
      
      <div class="mb-3">
        <label class="form-label fw-bold">رقم الموبايل</label>
        <input type="tel" class="form-control" id="phone" required placeholder="01xxxxxxxxx">
      </div>

      <div class="mb-3" id="gradeDiv" style="display: none;">
        <label class="form-label fw-bold">الصف الدراسي</label>
        <select class="form-select" id="grade">
          <option value="" selected disabled>اختر الصف</option>
          <option value="prep1">الأول الإعدادي</option>
          <option value="prep2">الثاني الإعدادي</option>
          <option value="prep3">الثالث الإعدادي</option>
          <option value="sec1">الأول الثانوي</option>
          <option value="sec2">الثاني الثانوي</option>
          <option value="sec3">الثالث الثانوي</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="email" required placeholder="example@email.com">
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">كلمة المرور</label>
        <input type="password" class="form-control" id="password" required placeholder="6 أحرف على الأقل" minlength="6">
      </div>

      <button type="submit" class="btn-register" id="submitBtn">📝 إنشاء الحساب</button>
    </form>
  </div>

  <script type="module">
    import { auth, database } from './firebase-config.js';
    import { createUserWithEmailAndPassword } from "firebase/auth";
    import { ref, set } from "firebase/database";
    import { sendTelegramNotification } from './assets/js/notify.js';

    // إظهار خانة الصف لو اختار طالب
    document.getElementById('role').addEventListener('change', function() {
      const gradeDiv = document.getElementById('gradeDiv');
      if (this.value === 'student') {
        gradeDiv.style.display = 'block';
        document.getElementById('grade').required = true;
      } else {
        gradeDiv.style.display = 'none';
        document.getElementById('grade').required = false;
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'جاري الإنشاء... ⏳';

      const role = document.getElementById('role').value;
      const name = document.getElementById('fullName').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const grade = role === 'student' ? document.getElementById('grade').value : '';

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await set(ref(database, 'students/' + user.uid), {
          name: name,
          phone: phone,
          email: email,
          role: role,
          grade: grade || 'none',
          createdAt: Date.now(),
          subscriptionStatus: 'inactive'
        });

        sendTelegramNotification(
          `🎓 <b>مستخدم جديد سجل في الأكاديمية!</b>\n\n` +
          `👤 الاسم: ${name}\n` +
          `📱 الموبايل: ${phone}\n` +
          `📧 الإيميل: ${email}\n` +
          `📌 الصفة: ${role === 'student' ? 'طالب - ' + grade : 'ولي أمر'}`
        );

        alert('✅ تم إنشاء حسابك بنجاح!');
        window.location.href = './student-dashboard.html';

      } catch (error) {
        alert('❌ حدث خطأ: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '📝 إنشاء الحساب';
      }
    });
  </script>
</body>
</html>
