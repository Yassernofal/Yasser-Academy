<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التسجيل – Mr. Yasser Nofal Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Cinzel:wght@600;700&family=El+Messiri:wght@500;700&family=Lateef:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'El Messiri', 'Lateef', serif;
      background: linear-gradient(135deg, #0a1f44, #1f4b8a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 78px;
    }
    @media (max-width: 991.98px) { body { padding-top: 72px; } }

    .navbar-custom {
      background: rgba(10, 31, 68, 0.85) !important;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 14px 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1050;
    }
    .navbar-brand { display: flex; align-items: center; gap: 10px; direction: ltr; }
    .navbar-brand img { height: 40px; width: auto; }
    .navbar-brand .brand-name {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: #f7e05e;
      letter-spacing: 1px;
    }
    .navbar-brand .brand-name span { color: #ffb347; }
    .nav-link { color: #e0e8f0 !important; font-weight: 500; transition: 0.3s; }
    .nav-link:hover { color: #f7e05e !important; }

    .register-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 40px;
      max-width: 550px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .register-card h4 { color: #0a1f44; font-weight: 700; font-family: 'Cinzel', serif; }
    .register-card .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f7e05e;
    }
    .btn-register {
      background: linear-gradient(135deg, #0a1f44, #1f4b8a);
      color: #fff;
      border-radius: 50px;
      padding: 14px;
      font-weight: 700;
      width: 100%;
      border: none;
      transition: 0.3s;
    }
    .btn-register:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(26, 67, 138, 0.3); }
    .register-card a { color: #1f4b8a; font-weight: 700; text-decoration: none; }
    .register-card a:hover { color: #0a1f44; }
    .role-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .role-selector .btn-role {
      flex: 1;
      border-radius: 50px;
      padding: 8px 12px;
      border: 2px solid #dee2e6;
      background: #fff;
      transition: 0.3s;
      font-family: 'El Messiri', serif;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .role-selector .btn-role.active {
      border-color: #0a1f44;
      background: #0a1f44;
      color: #fff;
    }
    .role-selector .btn-role:hover { border-color: #0a1f44; }
  </style>
</head>
<body>

  <!-- ===== شريط التنقل ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo" />
        <span class="brand-name">Mr. <span>Yasser</span> Nofal</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">🏠 الرئيسية</a></li>
          <li class="nav-item"><a class="nav-link" href="levels.html">📚 المستويات</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">📝 الاختبار</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">🔑 تسجيل الدخول</a></li>
          <li class="nav-item"><a class="nav-link active" href="register.html">📝 التسجيل</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== المحتوى ===== -->
  <div class="container">
    <div class="register-card">
      <div class="text-center mb-4">
        <img src="assets/images/mr-yasser.jpg" alt="Mr. Yasser Nofal" class="profile-img" />
        <h4 class="mt-2">إنشاء حساب جديد</h4>
        <p class="text-muted">📝 اختر دورك وسجل الآن</p>
      </div>

      <!-- اختيار الدور -->
      <div class="role-selector">
        <button class="btn-role active" data-role="student" onclick="selectRole('student')">
          <i class="fas fa-user-graduate"></i> طالب
        </button>
        <button class="btn-role" data-role="parent" onclick="selectRole('parent')">
          <i class="fas fa-users"></i> ولي أمر
        </button>
        <button class="btn-role" data-role="admin" onclick="selectRole('admin')">
          <i class="fas fa-user-tie"></i> أدمن
        </button>
      </div>

      <form onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="form-label">الاسم الكامل <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="name" required placeholder="أحمد محمد" />
        </div>
        <div class="mb-3">
          <label class="form-label">البريد الإلكتروني <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="email" required placeholder="example@email.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">كلمة المرور <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="password" required placeholder="•••••••• (8 أحرف على الأقل)" minlength="8" />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="agree" required />
          <label class="form-check-label">أوافق على <a href="#">شروط الاستخدام</a> و <a href="#">سياسة الخصوصية</a></label>
        </div>
        <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> إنشاء الحساب</button>
      </form>

      <div class="text-center mt-3">
        <p>🔑 لديك حساب بالفعل؟ <a href="login.html">سجل الدخول من هنا</a></p>
      </div>
    </div>
  </div>

  <script>
    // ===== اختيار الدور =====
    function selectRole(role) {
      document.querySelectorAll('.btn-role').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-role="${role}"]`).classList.add('active');
      document.getElementById('selectedRole').value = role;
    }

    // ===== التسجيل =====
    function handleRegister(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.querySelector('.btn-role.active')?.dataset.role || 'student';

      if (!name || !email || !password) {
        alert('❌ يرجى ملء جميع الحقول المطلوبة');
        return;
      }

      if (password.length < 8) {
        alert('❌ كلمة المرور يجب أن تكون 8 أحرف على الأقل');
        return;
      }

      // حفظ المستخدم
      const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');

      if (users.some(u => u.email === email)) {
        alert('❌ هذا البريد الإلكتروني مسجل بالفعل!');
        return;
      }

      users.push({
        name: name,
        email: email,
        password: password,
        role: role,
        registerDate: new Date().toISOString()
      });

      localStorage.setItem('registeredUsers', JSON.stringify(users));

      alert(`✅ تم إنشاء حسابك بنجاح! دورك: ${role === 'student' ? 'طالب' : role === 'parent' ? 'ولي أمر' : 'أدمن'}`);

      // التوجيه لتسجيل الدخول
      window.location.href = 'login.html';
    }

    // استعادة الدور المحفوظ
    const savedRole = localStorage.getItem('selectedRole') || 'student';
    selectRole(savedRole);
  </script>
  <script src="js/content-protection.js"></script>
</body>
</html>
