<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التسجيل – Mr. Yasser Nofal Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Cinzel:wght@600;700&family=El+Messiri:wght@500;700&family=Lateef:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'El Messiri', 'Lateef', serif;
      background: linear-gradient(135deg, #0a1f44, #1f4b8a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 78px;
    }
    @media (max-width: 991.98px) { body { padding-top: 72px; } }

    /* ===== شريط التنقل ===== */
    .navbar-custom {
      background: rgba(10, 31, 68, 0.85) !important;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 14px 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.3s ease;
      z-index: 1050;
    }
    .navbar-brand { display: flex; align-items: center; gap: 6px; transition: 0.3s; }
    .navbar-brand:hover { transform: scale(1.02); }
    .navbar-brand img { height: 40px; width: auto; }
    .navbar-nav .nav-item { margin: 0 4px; position: relative; }
    .navbar-nav .nav-link {
      color: rgba(255, 255, 255, 0.8) !important;
      font-family: 'El Messiri', serif;
      font-weight: 500;
      font-size: 1.05rem;
      padding: 10px 18px;
      border-radius: 12px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .navbar-nav .nav-link i { font-size: 0.95rem; color: #f7e05e; transition: 0.3s; }
    .navbar-nav .nav-link:hover { color: #fff !important; background: rgba(247, 224, 94, 0.10); transform: translateY(-2px); }
    .navbar-nav .nav-link.active { color: #f7e05e !important; background: rgba(247, 224, 94, 0.12); }
    .nav-indicator {
      position: absolute;
      bottom: 2px;
      right: 50%;
      width: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #f7e05e, #f7b731);
      border-radius: 4px;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: translateX(50%);
    }
    .nav-link:hover .nav-indicator,
    .nav-link.active .nav-indicator { width: 60%; }
    .navbar-toggler {
      border: none;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05) !important;
      border-radius: 12px;
      transition: 0.3s;
    }
    .navbar-toggler:hover { background: rgba(255, 255, 255, 0.10) !important; }
    .navbar-toggler:focus { box-shadow: none; }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 255, 255, 0.9)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
    }
    @media (max-width: 991.98px) {
      .navbar-collapse {
        background: rgba(10, 31, 68, 0.96);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 20px 15px;
        margin-top: 12px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        animation: slideDown 0.3s ease forwards;
      }
      .navbar-nav .nav-item { margin: 2px 0; }
      .navbar-nav .nav-link { padding: 12px 18px; border-radius: 12px; font-size: 1.05rem; }
      .navbar-nav .nav-link i { width: 24px; text-align: center; }
      .nav-indicator { display: none; }
      .navbar-nav .nav-link.active { background: rgba(247, 224, 94, 0.12); }
    }
    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-15px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    html { scroll-behavior: smooth; }

    /* ===== بطاقة التسجيل ===== */
    .register-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 40px;
      max-width: 550px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .register-card h4 { color: #0a1f44; font-weight: 700; font-family: 'Cinzel', serif; }
    .register-card .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #f7e05e;
    }
    .btn-register {
      background: linear-gradient(135deg, #0a1f44, #1f4b8a);
      color: #fff;
      border-radius: 50px;
      padding: 14px;
      font-weight: 700;
      width: 100%;
      border: none;
      transition: 0.3s;
    }
    .btn-register:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(26, 67, 138, 0.3); }
    .register-card a { color: #1f4b8a; font-weight: 700; text-decoration: none; }
    .register-card a:hover { color: #0a1f44; }
  </style>
</head>
<body>

  <!-- ===== شريط التنقل ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="assets/images/logo.png" alt="Logo" />
        <span style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.4rem; color: #f7e05e;">
          Mr. <span style="color: #ffb347;">Yasser</span> Nofal
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home"></i> الرئيسية<span class="nav-indicator"></span></a></li>
          <li class="nav-item"><a class="nav-link" href="levels.html"><i class="fas fa-layer-group"></i> المستويات<span class="nav-indicator"></span></a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html"><i class="fas fa-pencil-alt"></i> الاختبار<span class="nav-indicator"></span></a></li>
          <li class="nav-item"><a class="nav-link" href="login.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول<span class="nav-indicator"></span></a></li>
          <li class="nav-item"><a class="nav-link active" href="register.html"><i class="fas fa-user-plus"></i> التسجيل<span class="nav-indicator"></span></a></li>
          <li class="nav-item"><a class="nav-link" href="student-dashboard.html"><i class="fas fa-user-graduate"></i> لوحة الطالب<span class="nav-indicator"></span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== المحتوى ===== -->
  <div class="container">
    <div class="register-card">
      <div class="text-center mb-4">
        <img src="assets/images/mr-yasser.jpg" alt="Mr. Yasser Nofal" class="profile-img" />
        <h4 class="mt-2">إنشاء حساب جديد</h4>
        <p class="text-muted">📝 ابدأ رحلة تعلم اللغة الإنجليزية</p>
      </div>
      <div class="alert alert-success text-center py-2">
        <i class="fas fa-gift"></i> التسجيل مجاني! أنشئ حسابك الآن
      </div>
      <form onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label class="form-label">الاسم الكامل <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="name" required placeholder="أحمد محمد" />
        </div>
        <div class="mb-3">
          <label class="form-label">البريد الإلكتروني <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="email" required placeholder="example@email.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">كلمة المرور <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="password" required placeholder="•••••••• (8 أحرف على الأقل)" minlength="8" />
        </div>
        <div class="mb-3">
          <label class="form-label">المستوى الحالي</label>
          <select class="form-select" id="level">
            <option value="ما قبل الروضة">ما قبل الروضة</option>
            <option value="رياض الأطفال">رياض الأطفال</option>
            <option value="ابتدائي">ابتدائي</option>
            <option value="إعدادي">إعدادي</option>
            <option value="ثانوي" selected>ثانوي</option>
            <option value="جامعي">جامعي</option>
            <option value="ما بعد الجامعة">ما بعد الجامعة</option>
          </select>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="agree" required />
          <label class="form-check-label">أوافق على <a href="#">شروط الاستخدام</a> و <a href="#">سياسة الخصوصية</a></label>
        </div>
        <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> إنشاء الحساب</button>
      </form>
      <div class="text-center mt-3">
        <p>🔑 لديك حساب بالفعل؟ <a href="login.html">سجل الدخول من هنا</a></p>
      </div>
    </div>
  </div>

  <script>
    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const level = document.getElementById('level').value;
      if (!name || !email || !password) {
        alert('❌ يرجى ملء جميع الحقول المطلوبة');
        return;
      }
      if (password.length < 8) {
        alert('❌ كلمة المرور يجب أن تكون 8 أحرف على الأقل');
        return;
      }
      const users = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
      if (users.some(u => u.email === email)) {
        alert('❌ هذا البريد الإلكتروني مسجل بالفعل!');
        return;
      }
      users.push({ name, email, password, level, registerDate: new Date().toISOString() });
      localStorage.setItem('registeredUsers', JSON.stringify(users));
      alert('✅ تم إنشاء حسابك بنجاح! 🎉');
      window.location.href = 'login.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/content-protection.js"></script>
</body>
</html>
